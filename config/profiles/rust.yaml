# Rust / Cargo
# HOME is passed through so ~ paths below resolve to the real home directory.
commands: [cargo, rustc, rustup]
domains:
  - crates.io
  - "*.crates.io"
  - static.rust-lang.org
read:
  - ~/.cargo
  - ~/.rustup
exec:
  - sh
  - cargo
  - rustc
  - rustup
env:
  - HOME
  - CARGO_HOME
  - RUSTUP_HOME
