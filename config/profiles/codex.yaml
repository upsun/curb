# Codex (OpenAI).
# HOME is passed through so ~ paths below resolve to the real home directory.
# Includes git config/env directly (not via profile composition, to avoid
# inheriting SSH key access). Add -p ssh explicitly if needed.
#
# Codex's own sandbox cannot nest inside curb's namespace.
# Use --full-auto or configure sandbox settings — curb provides enforcement.
commands: [codex]
domains:
  - api.openai.com
  - chatgpt.com
read:
  - ~/.codex/config.toml
  - ~/.gitconfig
  - ~/.config/git
write:
  - .
  - ~/.codex
  - !~/.codex/config.toml
  - !~/.codex/plugins
exec:
  - /usr/bin
  - /bin
  - /usr/local/bin
  - /opt/homebrew/bin
env:
  - HOME
  - SHELL
  - OPENAI_API_KEY
  - CODEX_API_KEY
  - CODEX_HOME
  - GIT_AUTHOR_NAME
  - GIT_AUTHOR_EMAIL
  - GIT_COMMITTER_NAME
  - GIT_COMMITTER_EMAIL
