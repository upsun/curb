# OpenCode (provider-agnostic coding agent).
# HOME is passed through so ~ paths below resolve to the real home directory.
# Includes git config/env directly (not via profile composition, to avoid
# inheriting SSH key access). Add -p ssh explicitly if needed.
#
# Common provider domains are included. Add more via --domains if needed.
commands: [opencode]
# Node.js uses AF_UNIX socketpairs internally for child_process.spawn() stdio.
allow-unix-sockets: true
domains:
  - api.anthropic.com
  - api.githubcopilot.com
  - api.openai.com
read:
  - ~/.config/opencode/opencode.json
  - ./opencode.json
  - ~/.gitconfig
  - ~/.config/git
write:
  - .
  - ~/.config/opencode
  - ~/.opencode
  - !~/.config/opencode/opencode.json
exec:
  - /usr/bin
  - /bin
  - /usr/local/bin
  - /opt/homebrew/bin
env:
  - HOME
  - SHELL
  - ANTHROPIC_API_KEY
  - OPENAI_API_KEY
  - OPENCODE_CONFIG
  - GIT_AUTHOR_NAME
  - GIT_AUTHOR_EMAIL
  - GIT_COMMITTER_NAME
  - GIT_COMMITTER_EMAIL
