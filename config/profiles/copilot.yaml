# GitHub Copilot CLI.
# HOME is passed through so ~ paths below resolve to the real home directory.
# Includes git config/env directly (not via profile composition, to avoid
# inheriting SSH key access). Add -p ssh explicitly if needed.
#
# Closed source; profile based on public documentation.
# See: https://docs.github.com/en/copilot/reference/copilot-cli-reference
commands: [copilot]
domains:
  - "*.githubcopilot.com"
  - api.github.com
  - api.mcp.github.com
  - collector.github.com
  - copilot-proxy.githubusercontent.com
  - copilot-telemetry.githubusercontent.com
  - default.exp-tas.com
  - github.com
read:
  - ~/.copilot/config.json
  - ~/.copilot/mcp-config.json
  - ~/.copilot/permissions-config.json
  - ~/.copilot/agents
  - ~/.copilot/skills
  - ~/.copilot/hooks
  - ~/.config/gh/hosts.yml
  - ~/.gitconfig
  - ~/.config/git
write:
  - .
  - ~/.copilot
  - ~/.cache/copilot
  - !~/.copilot/config.json
  - !~/.copilot/mcp-config.json
  - !~/.copilot/permissions-config.json
  - !~/.copilot/agents
  - !~/.copilot/skills
  - !~/.copilot/hooks
exec:
  - /usr/bin
  - /bin
  - /usr/local/bin
  - /opt/homebrew/bin
env:
  - HOME
  - SHELL
  - COPILOT_GITHUB_TOKEN
  - COPILOT_HOME
  - COPILOT_MODEL
  - GITHUB_TOKEN
  - GH_TOKEN
  - GH_HOST
  - GIT_AUTHOR_NAME
  - GIT_AUTHOR_EMAIL
  - GIT_COMMITTER_NAME
  - GIT_COMMITTER_EMAIL
