# Claude Code.
# HOME is passed through so ~ paths below resolve to the real home directory.
# Includes git config/env directly (not via profile composition, to avoid
# inheriting SSH key access). Add -p ssh explicitly if needed.
domains:
  - api.anthropic.com
  - platform.claude.com
  - statsig.anthropic.com
read:
  - ~/.config/claude
  - ~/.gitconfig
  - ~/.config/git
write:
  - .
  - ~/.claude
  - ~/.claude.json
  - !~/.claude/agents
  - !~/.claude/commands
  - !~/.claude/CLAUDE.md
  - !~/.claude/settings.json
  - !./.claude/agents
  - !./.claude/commands
  # Workaround: Claude Code ignores $TMPDIR and hardcodes /tmp/claude-<UID>.
  # Inside a user namespace UID is always 0.
  - /tmp/claude-0
exec:
  - claude
  - node
  - npm
  - npx
  - git
  - gpg
env:
  - HOME
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_MAX_TOKENS
  - GIT_AUTHOR_NAME
  - GIT_AUTHOR_EMAIL
  - GIT_COMMITTER_NAME
  - GIT_COMMITTER_EMAIL
