# Interactive shell with access to standard system binaries.
# HOME is passed through so ~ resolves to the real home directory.
# Use -a for auto-apply (e.g. curb -a bash) or -p shell explicitly.
commands: [bash, zsh, sh, fish, dash, ksh, tcsh, csh]
read:
  - "~" # Quoted: bare ~ is YAML null.
exec:
  - /usr/bin
  - /bin
  - /usr/local/bin
  - /usr/sbin
  - /sbin
  - /usr/libexec
  - /opt/homebrew/bin
env:
  - HOME
