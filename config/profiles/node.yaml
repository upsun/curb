# Node.js / npm / yarn / pnpm
# HOME is passed through so ~ paths below resolve to the real home directory.
domains:
  - registry.npmjs.org
  - "*.npmjs.org"
  - "*.yarnpkg.com"
read:
  - ~/.npm
  - ~/.cache/yarn
  - ~/.local/share/pnpm
write:
  - node_modules
exec:
  - node
  - npm
  - npx
env:
  - HOME
  - NODE_ENV
  - NPM_CONFIG_REGISTRY
