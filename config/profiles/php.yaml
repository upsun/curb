# PHP / Composer
# HOME is passed through so ~ paths below resolve to the real home directory.
domains:
  - packagist.org
  - "*.packagist.org"
  - getcomposer.org
read:
  - ~/.composer
  - ~/.config/composer
  - ~/.cache/composer
write:
  - vendor
exec:
  - sh
  - php
  - composer
env:
  - HOME
  - COMPOSER_HOME
  - COMPOSER_CACHE_DIR
  - PHP_INI_SCAN_DIR
