# SSH client (enables unix sockets for agent forwarding).
# HOME is passed through so ~ paths below resolve to the real home directory.
commands: [ssh, scp, sftp]
allow-unix-sockets: true
read:
  - ~/.ssh
  # macOS login keychain (ssh UseKeychain passphrase storage). Ignored on Linux.
  - ~/Library/Keychains
exec:
  - ssh
  - ssh-keygen
env:
  - HOME
  - SSH_AUTH_SOCK
