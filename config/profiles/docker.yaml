# Docker
# HOME is passed through so ~ paths below resolve to the real home directory.
# Note: most setups also need --write /var/run/docker.sock and --allow-unix-sockets
# for the daemon socket.
domains:
  - registry-1.docker.io
  - auth.docker.io
  - production.cloudflare.docker.com
read:
  - ~/.docker
exec:
  - docker
  - docker-compose
env:
  - HOME
  - DOCKER_HOST
