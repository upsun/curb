# Claude Code.
# HOME is passed through so ~ paths below resolve to the real home directory.
# Includes git config/env directly (not via profile composition, to avoid
# inheriting SSH key access). Add -p ssh explicitly if needed.
#
# Claude Code's own bwrap sandbox cannot nest inside curb's namespace.
# Set sandbox.enabled: false in Claude Code settings — curb provides enforcement.
#
# Credential sealing (Linux): when ANTHROPIC_API_KEY is set on the host, it is
# kept out of the sandbox — the process sees only a placeholder, and curb's
# proxy replaces that placeholder with the real key in requests to
# api.anthropic.com (in whatever header Claude Code sends it). With no host key
# set, nothing is injected and OAuth/subscription auth works unchanged. On first
# run, Claude Code may prompt once to approve the placeholder as a custom API
# key. Caveat: a custom ANTHROPIC_BASE_URL is not covered (the seal targets
# api.anthropic.com).
commands: [claude]
# Node.js/Bun use AF_UNIX socketpairs internally for child_process.spawn() stdio.
allow-unix-sockets: true
domains:
  - api.anthropic.com
  - downloads.claude.ai
  - mcp.anthropic.com
  - platform.claude.com
  - statsig.anthropic.com
read:
  - ~/.claude.json
  - ~/.config/claude
  - ~/.gitconfig
  - ~/.config/git
  # macOS login keychain (OAuth token under "Claude Code-credentials").
  # Ignored on Linux (path does not exist).
  - ~/Library/Keychains
write:
  - .
  - ~/.claude
  - ~/.claude.json
  - !~/.claude/agents
  - !~/.claude/commands
  - !~/.claude/CLAUDE.md
  - !~/.claude/rules
  - !~/.claude/settings.json
  - !~/.claude/skills
  - !./.claude/agents
  - !./.claude/commands
  - !./.claude/rules
  - !./.claude/settings.json
  - !./.claude/settings.local.json
  - !./.claude/skills
  - !./.mcp.json
exec:
  - /usr/bin
  - /bin
  - /usr/local/bin
  - /opt/homebrew/bin
# Seal ANTHROPIC_API_KEY: the sandbox sees only a placeholder, and curb's proxy
# replaces it with the real key (read from the host env) in requests to
# api.anthropic.com — whichever header Claude Code sends it in. Skipped when the
# host key is unset, so OAuth users are unaffected.
inject-header:
  - ANTHROPIC_API_KEY=api.anthropic.com
env:
  - HOME
  - SHELL
  - CLAUDE_CODE_TMPDIR=$TMPDIR
  - ANTHROPIC_BASE_URL
  - CLAUDE_CODE_MAX_TOKENS
  - GIT_AUTHOR_NAME
  - GIT_AUTHOR_EMAIL
  - GIT_COMMITTER_NAME
  - GIT_COMMITTER_EMAIL
