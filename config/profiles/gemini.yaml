# Gemini CLI (Google).
# HOME is passed through so ~ paths below resolve to the real home directory.
# Includes git config/env directly (not via profile composition, to avoid
# inheriting SSH key access). Add -p ssh explicitly if needed.
#
# Gemini CLI's own sandbox cannot nest inside curb's namespace.
# Run with --sandbox=none in Gemini CLI — curb provides enforcement.
commands: [gemini]
# Node.js uses AF_UNIX socketpairs internally for child_process.spawn() stdio.
allow-unix-sockets: true
domains:
  - cloudcode-pa.googleapis.com
  - cloudcode.googleapis.com
  - genai.googleapis.com
  - generativelanguage.googleapis.com
  - iamcredentials.googleapis.com
read:
  - ~/.gemini/settings.json
  - ~/.gemini/agents
  - ~/.gitconfig
  - ~/.config/git
write:
  - .
  - ~/.gemini
  - !~/.gemini/settings.json
  - !~/.gemini/agents
exec:
  - /usr/bin
  - /bin
  - /usr/local/bin
  - /opt/homebrew/bin
env:
  - HOME
  - SHELL
  - GEMINI_API_KEY
  - GOOGLE_API_KEY
  - GEMINI_CLI_HOME
  - GIT_AUTHOR_NAME
  - GIT_AUTHOR_EMAIL
  - GIT_COMMITTER_NAME
  - GIT_COMMITTER_EMAIL
