# Python / pip
# HOME is passed through so ~ paths below resolve to the real home directory.
commands: [python, python3, pip, pip3]
domains:
  - pypi.org
  - "*.pythonhosted.org"
read:
  - ~/.cache/pip
  - ~/.local/lib
exec:
  - sh
  - python3
  - pip
  - pip3
env:
  - HOME
  - VIRTUAL_ENV
  - PIP_INDEX_URL
