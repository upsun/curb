# Go (includes C compiler for CGO).
# HOME is passed through so ~ paths below resolve to the real home directory.
commands: [go]
profiles:
  - cc
domains:
  - proxy.golang.org
  - sum.golang.org
  - storage.googleapis.com
  - vuln.go.dev
read:
  - ~/go
  - ~/sdk
  - /usr/local/go
write:
  - ~/.cache/go-build
  - ~/go/pkg
exec:
  - sh
  - go
  - ~/.cache/go-build
  # GOTOOLCHAIN=auto downloads alternate toolchains into
  # ~/go/pkg/mod/golang.org/toolchain@<version>-<platform>/ and re-execs
  # the nested go<version> binary. The parent dir also holds module caches
  # for golang.org/* modules; exec there is scoped to Go's module tree.
  - ~/go/pkg/mod/golang.org
env:
  - HOME
  - CGO_ENABLED
  - GOPATH
  - GOMODCACHE
  - GOROOT
  - GOCACHE
  - GOFLAGS
  - GOMAXPROCS
  - GONOSUMCHECK
  - GONOSUMDB
  - GOPROXY
  - GOPRIVATE
  - GOTOOLCHAIN
