# Go (includes C compiler for CGO).
# HOME is passed through so ~ paths below resolve to the real home directory.
commands: [go]
profiles:
  - cc
domains:
  - proxy.golang.org
  - sum.golang.org
  - storage.googleapis.com
  - vuln.go.dev
read:
  - ~/go
  - ~/sdk
  - /usr/local/go
write:
  - ~/.cache/go-build
  - ~/go/pkg
exec:
  - sh
  - go
  - ~/.cache/go-build
env:
  - HOME
  - CGO_ENABLED
  - GOPATH
  - GOMODCACHE
  - GOROOT
  - GOCACHE
  - GOFLAGS
  - GOMAXPROCS
  - GONOSUMCHECK
  - GONOSUMDB
  - GOPROXY
  - GOPRIVATE
  - GOTOOLCHAIN
